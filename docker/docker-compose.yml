# Poisonarr – a single container (API + web UI), built from this repository.
#   docker compose -f docker/docker-compose.yml up -d --build
# The full stack (Plex, Seerr, *arr, qBittorrent) is installed by the Proxmox installer, see proxmox/README.md.
services:
  poisonarr:
    container_name: poisonarr
    image: poisonarr:local
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_URLS: http://+:8080
      App__DataDir: /app/data

      # PUID/PGID: UID/GID of the account that should own the files on the host (id -u / id -g).
      PUID: "10001"
      PGID: "10001"

      # Optional: stable master key (otherwise one is generated and stored in /app/data/keys)
      # FEEDARR_MASTER_KEY: "put-a-unique-value-here"

    volumes:
      - ./data:/app/data
    ports:
      - "8888:8080"
